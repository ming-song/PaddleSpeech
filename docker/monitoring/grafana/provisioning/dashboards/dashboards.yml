# Grafana 仪表板配置
# 自动加载预配置的仪表板

apiVersion: 1

providers:
  - name: 'PaddleSpeech Dashboards'
    orgId: 1
    folder: 'PaddleSpeech'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json

  - name: 'System Dashboards'
    orgId: 1
    folder: 'System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/system